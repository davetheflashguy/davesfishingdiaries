version: "3.9"

services:
  db:
    image: postgres:16
    container_name: davesfishingdiaries_db
    restart: always
    env_file:
      - .env.production
    # No ports exposed - only backend can access internally
    volumes:
      - ./db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: davesfishingdiaries_api
    restart: always
    env_file:
      - .env.production
    depends_on:
      - db
    # No ports exposed - only nginx proxies to it internally
    volumes:
      - ./backend:/app
      - ./data:/data   # <-- Excel lives here
    command: >
      sh -c "
      python scripts/ingest_catches.py &&
      uvicorn main:app --host 0.0.0.0 --port 8000
      "

  ui:
    build: ./ui
    container_name: davesfishingdiaries_ui
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ui/app/nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  postgres_data:
