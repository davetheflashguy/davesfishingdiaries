services:
  db:
    image: postgres:16
    container_name: davesfishingdiaries_db
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: davesfishingdiaries_api
    restart: always
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
